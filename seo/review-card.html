<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Kami Review Card</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@page{size:105mm 148mm;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#999}
.post{width:1240px;height:1748px;position:relative;overflow:hidden;color:#2E3B2A;
  background:linear-gradient(165deg,#B2BF9D 0%,#A7B591 50%,#9CAB86 100%);font-family:'IBM Plex Sans Arabic',sans-serif}
.st{position:absolute;fill:#EDE9E0}
.st.a{width:700px;height:700px;left:-260px;bottom:120px;opacity:.18}
.st.b{width:300px;height:300px;right:-90px;top:300px;fill:#E2CDCC;opacity:.55}
.logo{position:absolute;top:110px;left:50%;transform:translateX(-50%);width:420px}
.in{position:absolute;top:400px;left:100px;right:100px;text-align:center}
h1{font-family:'Readex Pro';font-weight:700;font-size:108px;line-height:1.35}
.hl{background:#E2CDCC;border-radius:16px;padding:0 24px}
.sub{font-size:46px;margin-top:30px;line-height:1.6;color:#394634}
.qr{margin:70px auto 0;width:560px;height:560px;background:#EDE9E0;border-radius:44px;padding:34px;box-shadow:0 20px 50px rgba(46,59,42,.2)}
.qr img{width:100%;height:100%;display:block}
.how{margin-top:46px;font-family:'Readex Pro';font-weight:500;font-size:44px}
.stars{margin-top:22px;font-size:60px;letter-spacing:12px;color:#2E3B2A}
.foot{position:absolute;bottom:80px;left:100px;right:100px;display:flex;justify-content:space-between;align-items:center;
  border-top:2px solid rgba(46,59,42,.25);padding-top:34px;font-size:40px;direction:ltr}
.foot b{font-family:'Readex Pro';font-size:48px}
</style></head><body>
<section class="post" id="review-card">
  <svg class="st a" viewBox="0 0 100 100"><path d="M50 0Q50 50 100 50Q50 50 50 100Q50 50 0 50Q50 50 50 0Z"/></svg>
  <svg class="st b" viewBox="0 0 100 100"><path d="M50 0Q50 50 100 50Q50 50 50 100Q50 50 0 50Q50 50 50 0Z"/></svg>
  <img class="logo" src="../brand/logo-en-green.png">
  <div class="in">
    <h1>رأيكم <span class="hl">يفرق معانا</span></h1>
    <div class="sub">إذا عجبكم طلبكم، قولوا للناس عنّا<br>بتقييم على قوقل 🤍</div>
    <div class="qr"><img src="review-qr.png"></div>
    <div class="how">امسحوا الكود بكاميرا الجوال</div>
    <div class="stars">★★★★★</div>
  </div>
  <div class="foot"><span>@kami.printing</span><b>66606959</b></div>
</section></body></html>
