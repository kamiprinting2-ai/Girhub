<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Kami National Day Labels</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ccc;display:flex;gap:40px;padding:40px;flex-wrap:wrap;font-family:'IBM Plex Sans Arabic'}
.post{position:relative;overflow:hidden}
/* round sticker 1200x1200 */
#sticker{width:1200px;height:1200px;border-radius:50%;background:#fff;border:28px solid #CE1126;display:flex;flex-direction:column;align-items:center;justify-content:center}
#sticker .teeth{position:absolute;top:0;left:0;width:100%;height:150px}
#sticker .k{font-family:'Readex Pro';font-weight:500;font-size:62px;color:#CE1126;margin-top:90px}
#sticker .name{font-family:'Readex Pro';font-weight:700;font-size:250px;color:#2E3B2A;line-height:1.1}
#sticker .d{font-family:'Readex Pro';font-weight:700;font-size:84px;color:#fff;background:#CE1126;border-radius:60px;padding:4px 50px;margin-top:20px}
#sticker .logo{position:absolute;bottom:70px;width:200px;opacity:.9}
/* box label 1600x1000 */
#label{width:1600px;height:1000px;background:#fff;border-radius:40px;display:flex}
#label .flag{width:520px;height:100%;flex:none}
#label .in{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px}
#label .t{font-family:'Readex Pro';font-weight:700;font-size:96px;color:#CE1126;line-height:1.2}
#label .s{font-family:'IBM Plex Sans Arabic';font-weight:600;font-size:52px;color:#2E3B2A;margin-top:18px}
#label .name{font-family:'Readex Pro';font-weight:700;font-size:150px;color:#2E3B2A;margin-top:40px;border-top:4px dashed #CE1126;padding-top:24px;width:80%}
#label .logo{width:190px;margin-top:40px}
/* ribbon strip 2400x200 */
#ribbon{width:2400px;height:200px;background:#CE1126;display:flex;align-items:center;justify-content:space-around;color:#fff;font-family:'Readex Pro';font-weight:700;font-size:80px;direction:ltr}
#ribbon span{display:flex;align-items:center;gap:18px}
#ribbon .h{color:#fff;font-size:86px}
</style></head><body>
<div class="post" id="sticker">
  <svg class="teeth" viewBox="0 0 1200 150" preserveAspectRatio="none"><rect width="1200" height="150" fill="#fff"/></svg>
  <div class="k">العيد الوطني البحريني</div>
  <div class="name">جود</div>
  <div class="d">١٦ ديسمبر</div>
  <img class="logo" src="../brand/logo-en-green.png">
</div>
<div class="post" id="label">
  <svg class="flag" viewBox="0 0 520 1000" preserveAspectRatio="none">
    <rect width="520" height="1000" fill="#CE1126"/>
    <polygon fill="#fff" points="0,0 230,0 340,100 230,200 340,300 230,400 340,500 230,600 340,700 230,800 340,900 230,1000 0,1000"/>
  </svg>
  <div class="in">
    <div class="t">كل عام<br>والبحرين بخير</div>
    <div class="s">العيد الوطني · ١٦ ديسمبر</div>
    <div class="name">جود</div>
    <img class="logo" src="../brand/logo-en-green.png">
  </div>
</div>
<div class="post" id="ribbon">
  <span>I <b class="h">♥</b> BAHRAIN</span><span>١٦ ديسمبر</span><span>I <b class="h">♥</b> BAHRAIN</span><span>١٦ ديسمبر</span>
</div>
</body></html>
