<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<title>Kami cups reel</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#A7B591}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'IBM Plex Sans Arabic',sans-serif;color:#2E3B2A}
.bg{position:absolute;inset:0;background:linear-gradient(200deg,#B2BF9D 0%,#A7B591 55%,#9CAB86 100%)}
.star{position:absolute}
.scene{position:absolute;inset:0;opacity:0}
.card{position:absolute;border-radius:34px;overflow:hidden;background:#EDE9E0;border:14px solid #EDE9E0;
  box-shadow:0 26px 60px rgba(46,59,42,.28),0 4px 12px rgba(46,59,42,.15)}
.card img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
.full{position:absolute;inset:0;overflow:hidden}
.full img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.veil{position:absolute;left:0;right:0;top:0;height:760px;background:linear-gradient(180deg,rgba(46,59,42,.35),rgba(46,59,42,0))}
.head{position:absolute;left:70px;right:70px;top:250px;text-align:center}
.l1,.l2{font-family:'Readex Pro',sans-serif;font-weight:700;line-height:1.25;display:inline-block}
.l1{font-size:70px;color:#2E3B2A}
.l2{font-size:70px;background:#E2CDCC;color:#2E3B2A;border-radius:26px;padding:6px 34px 14px;margin-top:14px}
.panel{display:inline-block;background:rgba(237,233,224,.94);border-radius:40px;padding:34px 44px 38px;box-shadow:0 18px 50px rgba(46,59,42,.25)}
.logo{position:absolute;left:56px;top:84px;height:116px;padding:14px 24px;background:rgba(237,233,224,.9);border-radius:28px;box-shadow:0 8px 24px rgba(46,59,42,.18)}
.w{display:inline-block}
.cta{position:absolute;left:90px;right:90px;top:1270px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:22px;background:#2E3B2A;color:#EDE9E0;border-radius:999px;padding:22px 46px 26px;
  font-family:'Readex Pro',sans-serif;font-weight:600;font-size:46px;box-shadow:0 16px 40px rgba(46,59,42,.3)}
.pill b{font-family:'Readex Pro';font-weight:700;letter-spacing:1px;direction:ltr;unicode-bidi:isolate}
.handle{margin-top:30px;font-family:'Readex Pro';font-weight:600;font-size:44px;color:#2E3B2A;direction:ltr}
.emoji{font-family:'Noto Color Emoji';font-weight:400}
</style></head>
<body><div id="stage">
  <div class="bg"></div>
  <svg class="star" id="star1" width="190" height="190" viewBox="-50 -50 100 100" style="left:905px;top:420px"><path d="M0-50C4-12 12-4 50 0C12 4 4 12 0 50C-4 12-12 4-50 0C-12-4-4-12 0-50Z" fill="#C6C4B0"/></svg>
  <svg class="star" id="star2" width="430" height="430" viewBox="-50 -50 100 100" style="left:-130px;top:1180px;opacity:.35"><path d="M0-50C4-12 12-4 50 0C12 4 4 12 0 50C-4 12-12 4-50 0C-12-4-4-12 0-50Z" fill="#D5DDC6"/></svg>

  <!-- S1 hook: all products together -->
  <div class="scene" id="s1">
    <div class="card" id="s1a" style="left:30px;top:820px;width:400px;height:580px"><img src="photos/toppers.jpg" style="object-position:30% 70%"></div>
    <div class="card" id="s1c" style="left:650px;top:850px;width:400px;height:540px"><img src="photos/sticker.jpg"></div>
    <div class="card" id="s1b" style="left:300px;top:660px;width:480px;height:700px"><img src="photos/cups.jpg" style="object-position:40% 55%"></div>
    <div class="head"><div class="l1" id="h1a"></div><br><div class="l2" id="h1b"></div></div>
  </div>

  <!-- S2 cups full bleed -->
  <div class="scene" id="s2">
    <div class="full"><img id="s2img" src="photos/cups.jpg" style="object-position:45% 50%"></div>
    <div class="veil"></div>
    <div class="head"><div class="panel" id="p2"><div class="l1" id="h2a">أكواب تميّز مشروعك</div><br><div class="l2" id="h2b">من التصميم للتنفيذ</div></div></div>
  </div>

  <!-- S3 sticker sheet + toppers -->
  <div class="scene" id="s3">
    <div class="card" id="s3a" style="left:60px;top:560px;width:960px;height:780px"><img src="photos/sheet.jpg" style="object-position:50% 40%"></div>
    <div class="card" id="s3b" style="left:470px;top:1000px;width:520px;height:640px"><img src="photos/toppers.jpg" style="object-position:40% 62%"></div>
    <div class="card" id="s3c" style="left:90px;top:1120px;width:380px;height:470px"><img src="photos/sticker.jpg"></div>
    <div class="head"><div class="l1" id="h3a">ستيكر شيت يبرز براندك..</div><br><div class="l2" id="h3b" style="font-size:60px;white-space:nowrap">ولمسات ضيافة تحلّي جمعتهم</div></div>
  </div>

  <!-- S4 bundle + CTA -->
  <div class="scene" id="s4">
    <div class="card" id="s4a" style="left:22px;top:640px;width:370px;height:520px"><img src="photos/toppers.jpg" style="object-position:50% 60%"></div>
    <div class="card" id="s4b" style="left:345px;top:600px;width:390px;height:580px"><img src="photos/cups.jpg" style="object-position:40% 55%"></div>
    <div class="card" id="s4c" style="left:688px;top:640px;width:370px;height:520px"><img src="photos/sticker.jpg"></div>
    <div class="head"><div class="l1" id="h4a">متوفرة كباقة متكاملة</div><br><div class="l2" id="h4b">أو بالطلب المنفصل <span class="emoji">🤍</span></div></div>
    <div class="cta" id="cta">
      <div class="pill"><svg width="56" height="56" viewBox="0 0 24 24"><path fill="#9CAB86" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/><path fill="#EDE9E0" d="M16.9 14.3c-.3-.1-1.6-.8-1.8-.9s-.4-.1-.6.1-.7.9-.8 1-.3.2-.6.1a7 7 0 0 1-3.4-3c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.5l-.8-2c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.3 5.3 0 0 0 1.1 2.8 12 12 0 0 0 4.6 4.1c1.7.7 2.4.8 3.2.6a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.2-.3-.3-.6-.4z"/></svg>
        <span>حيّاكم على الواتساب</span><b>66606959</b></div>
      <div class="handle">@kami.printing</div>
    </div>
  </div>

  <img class="logo" id="logo" src="../../brand/logo.png">
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const out=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const prog=(t,a,b)=>cl((t-a)/(b-a));
// words for the hook so it types in fast
const H1A='شلون تفصيل صغير يخلّي', H1B='زبونك يصوّر عملك؟ ✦';
function words(el,txt){el.innerHTML=txt.split(' ').map(w=>`<span class="w">${w}</span>`).join(' ')}
words($('h1a'),H1A); words($('h1b'),H1B);
function fadeWords(el,t,start,step){[...el.children].forEach((s,i)=>{const p=out(prog(t,start+i*step,start+i*step+.3));s.style.opacity=p;s.style.transform=`translateY(${(1-p)*24}px)`})}
function show(el,p,dy=40,sc=1){el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dy}px) scale(${sc})`}
function card(el,p,rot,dy=120,drift=0){el.style.opacity=cl(p*1.6);el.style.transform=`translateY(${(1-back(p))*dy+drift}px) rotate(${rot}deg) scale(${.92+.08*back(p)})`}
function sceneOp(t,a,b,f=.35){return Math.min(ease(prog(t,a-f/2,a+f/2)),1-ease(prog(t,b-f/2,b+f/2)))}
window.renderAt=function(t){
  // stars breathe slowly
  $('star1').style.transform=`rotate(${t*4}deg) scale(${1+.04*Math.sin(t*1.3)})`;
  $('star2').style.transform=`rotate(${-t*2}deg)`;
  const o1=t<3?1:1-ease(prog(t,2.85,3.2)), o2=sceneOp(t,3.05,6.05), o3=sceneOp(t,6.05,9.05), o4=ease(prog(t,8.9,9.25));
  $('s1').style.opacity=o1; $('s2').style.opacity=o2; $('s3').style.opacity=o3; $('s4').style.opacity=o4;
  // S1
  card($('s1b'),prog(t,-.5,.3),-1.5,140,-t*6);
  card($('s1a'),prog(t,-.4,.45),-8,160,-t*4);
  card($('s1c'),prog(t,-.3,.55),7,160,-t*5);
  $('s1b').querySelector('img').style.transform=`scale(${1.04+t*.03})`;
  fadeWords($('h1a'),t,-.6,.06); fadeWords($('h1b'),t,-.35,.06); const pb=out(prog(t,-.4,.1)); $('h1b').style.opacity=pb; $('h1b').style.transform=`scale(${.94+.06*pb})`;
  // S2 slow push-in + pan
  const p2=prog(t,2.9,6.2);
  $('s2img').style.transform=`scale(${1.06+.12*p2}) translate(${-14*p2}px,${-24*p2}px)`;
  show($('p2'),out(prog(t,3.05,3.5)),30); show($('h2a'),out(prog(t,3.1,3.55)),0); show($('h2b'),out(prog(t,3.55,4.05)));
  // S3
  card($('s3a'),prog(t,6.0,6.6),-1.5,140,-(t-6)*6); $('s3a').querySelector('img').style.transform=`scale(${1.02+(t-6)*.03})`;
  card($('s3b'),prog(t,7.35,7.95),4,260,-(t-7.3)*8);
  card($('s3c'),prog(t,7.5,8.1),-6,260,-(t-7.4)*6);
  show($('h3a'),out(prog(t,6.15,6.65))); show($('h3b'),out(prog(t,7.4,7.9)),30,1);
  // S4
  card($('s4b'),prog(t,9.0,9.55),0,120,-(t-9)*5);
  card($('s4a'),prog(t,9.12,9.67),-6,140,-(t-9)*4);
  card($('s4c'),prog(t,9.24,9.79),6,140,-(t-9)*4);
  show($('h4a'),out(prog(t,9.25,9.75))); show($('h4b'),out(prog(t,9.5,10.0)));
  const pc=prog(t,10.0,10.5); $('cta').style.opacity=out(pc); $('cta').style.transform=`translateY(${(1-out(pc))*40}px) scale(${1+.025*Math.sin(Math.max(0,t-10.6)*3.2)*(t>10.6?1:0)})`;
  // logo
  $('logo').style.opacity=1;
};
window.renderAt(0);
</script>
</body></html>
